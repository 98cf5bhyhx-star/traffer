<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traffic CRM</title>
<style>
:root{--bg:#070a10;--card:#101621;--line:#202a38;--text:#f6f8fb;--muted:#8996a8;--blue:#2ea6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -15%,#17436d,transparent 43%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}
.card{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:26px;background:#101621ee;box-shadow:0 30px 100px #0009}
.logo{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#2ea6ff,#7357ff);font-size:25px;margin-bottom:20px}
h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);margin:0 0 25px}
label{display:block;color:#b9c3d0;font-size:13px;margin:14px 0 7px}
input{width:100%;border:1px solid var(--line);background:#0a0f17;color:var(--text);padding:14px;border-radius:13px;outline:0}
input:focus{border-color:var(--blue)}button{width:100%;border:0;background:var(--blue);color:white;font-weight:800;padding:14px;border-radius:13px;margin-top:19px}
#error{display:none;background:#3b1720;color:#ff9baa;border:1px solid #682634;padding:10px;border-radius:10px;margin-top:12px}
.hint{text-align:center;color:#69778a;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main class="card">
<div class="logo">↗</div>
<h1>Traffic CRM</h1>
<p class="sub">Панель керування Telegram-трафіком</p>
<form id="login">
<label>Логін</label><input id="username" autocomplete="username" required>
<label>Пароль</label><input id="password" type="password" autocomplete="current-password" required>
<button>Увійти</button>
<div id="error"></div>
</form>
<div class="hint">Для production задай ADMIN_USERNAME та ADMIN_PASSWORD у змінних середовища.</div>
</main>
<script>
login.addEventListener("submit",async e=>{
 e.preventDefault(); error.style.display="none";
 const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username:username.value,password:password.value})});
 const d=await r.json().catch(()=>({detail:"Помилка"}));
 if(r.ok) location="/dashboard"; else {error.textContent=d.detail||"Помилка входу";error.style.display="block"}
});
</script>
</body>
</html>
